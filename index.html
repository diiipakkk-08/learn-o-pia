<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Learnopia / Workspace — Student Study Studio & Academic OS</title>
    <!-- Google Fonts: Instrument Serif, Newsreader, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body class="bg-canvas text-text-primary antialiased selection:bg-[#E2DDD3] selection:text-[#141413]">
    <div id="root"></div>
    <script>
      // Global safety error catcher
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="padding: 40px; color: #141413; background: #F7F5F0; min-height: 100vh; font-family: monospace; z-index: 9999; position: relative;">' +
            '<h2 style="color: #141413; margin-bottom: 12px; font-family: serif; font-size: 24px;">Learnopia Diagnostic</h2>' +
            '<p style="color: #A62626; margin-bottom: 16px; font-size: 1rem;">' + (e.message || 'An error occurred during startup.') + '</p>' +
            '<pre style="background: #EFECE6; padding: 16px; border-radius: 8px; color: #575550; white-space: pre-wrap; font-size: 0.85rem; border: 1px solid #E4E0D8;">' + (e.filename || '') + (e.lineno ? (':' + e.lineno) : '') + '</pre>' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="margin-top: 20px; padding: 10px 20px; background: #141413; color: #F7F5F0; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">Reset Cache & Reload</button>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
